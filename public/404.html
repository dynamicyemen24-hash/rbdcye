<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رحماء بينهم | الصفحة غير موجودة</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Cairo',sans-serif;background:#F8F5EC;color:#17202A;display:flex;align-items:center;justify-content:center;min-height:100vh;direction:rtl}
    .container{text-align:center;max-width:480px;padding:2rem}
    .code{font-size:6rem;font-weight:900;color:#0F4C3A;line-height:1}
    .icon{font-size:4rem;margin:1rem 0}

    p{font-size:1.1rem;color:#6B6878;line-height:1.8;margin-bottom:2rem}
    a{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:#0F4C3A;color:#FFFFFF;border-radius:16px;font-weight:800;text-decoration:none;font-size:1rem}
    a:hover{background:#17694F}
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <div class="icon">🔍</div>
    <h1>الصفحة غير موجودة</h1>
    <p>يبدو أن الصفحة التي تبحث عنها غير موجودة أو تم نقلها. يرجى التحقق من الرابط أو العودة للصفحة الرئيسية.</p>
    <a href="/">🏠 العودة إلى الصفحة الرئيسية</a>
  </div>
</body>
</html>
